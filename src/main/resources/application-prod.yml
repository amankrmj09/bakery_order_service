spring:
  datasource:
    url: ${ORDER_DB_URL}
    username: ${ORDER_DB_USER}
    password: ${ORDER_DB_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

order:
  delivery:
    default-time-minutes: ${ORDER_DELIVERY_TIME:60}
  limits:
    max-items-per-order: ${ORDER_MAX_ITEMS:50}
    max-order-value: ${ORDER_MAX_VALUE:50000.00}
